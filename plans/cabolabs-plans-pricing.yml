note: >-
  CaboLabs publishes three NAMED licensing tiers for Atomik but NO price, no
  currency, no billing period, no included quota and no overage rate for any of
  them. Every tier ends in the same call to action - "Talk to us about this option"
  - and the page instead lists the four things CaboLabs will ask before quoting.
  There is no sign-up, no self-serve trial and no published card price anywhere on
  cabolabs.com or atomik.app, so plan_count is 3 by name and 0 by price. EHRServer
  and the rest of the open-source estate (openEHR-SDK, openEHR-CLI, dicom-waveform)
  are Apache-2.0 and carry no licence fee at all; they are recorded separately
  below rather than as a free tier of Atomik, because they are different products.
