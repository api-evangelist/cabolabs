  url: https://github.com/ppazos/testehr
  description: Load tester for the openEHR API.
published_collections:
- name: EHRServer 2.0 API (Insomnia)
  format: Insomnia v4 export
  url: https://github.com/ppazos/cabolabs-ehrserver/blob/master/api/EHRServer_2_0_API_Insomnia.json
  local_copy: examples/cabolabs-ehrserver-2.0-insomnia.json
  requests: 73
  description: >-
    A real, importable request collection covering the whole EHRServer REST surface -
    auth, organizations, users, EHRs, templates, contributions, compositions, queries,
    management stats and sync. The closest thing either product has to a machine-
    readable contract. Its bundled environments point at localhost, LAN addresses and
    the now-defunct cloudehrserver.com, so the base URL must be replaced with the
    reader's own deployment before anything runs.
  note: >-
    The published file embeds an expired 2019 sync JWT and a terminology-service key
    in its environment variables. API Evangelist's saved copy is passed through the
    network secret sanitizer; the upstream file is unchanged and is CaboLabs' to fix.
gaps:
- No hosted sandbox, demo tenant, or interactive API console.
- No test-vs-live credential distinction at the API level - a DEV licence is a commercial arrangement, not an API mode.
- No time simulation, test clocks, or event/webhook triggers.
- No Postman collection or workspace (the published collection is Insomnia format).
