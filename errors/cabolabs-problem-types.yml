rfc9457: false
note: 'The EHRServer project publishes a real, structured error-code registry on its GitHub wiki: a dotted
  code (e<group>.<number>), the condition that raises it, and the HTTP status returned. It is NOT RFC
  9457 - responses are not application/problem+json and there is no type URI. The registry is also visibly
  unfinished by its authors'' own marking: the /commit and /checkout groups carry the code prefix ''e02.''
  and ''e03.'' with no number assigned, and the Message column is empty for every single row, so a client
  can map a code to a cause but cannot render a provider-authored message. Two rows carry the authors''
  own corrections in-line, noting a status that should be 401 rather than 400. Recorded verbatim rather
  than tidied - the gaps are the finding.

  IMPORTANT SCOPE: this catalogue covers EHRServer ONLY. Atomik, the commercial product, publishes no
  error catalogue at all; its documentation describes error behaviour only in prose.'
envelope:
  documented: false
  note: No error response body schema is published; the Message column of the registry is empty throughout.
code_scheme:
  pattern: e<NN>.<NNNN>
  groups:
    e01: /login - authentication and organization association
    e02: /commit - clinical data commit (code numbers unassigned)
    e03: /checkout - composition checkout (code numbers unassigned)
    e04: /ehrs - EHR collection
    e05: /ehrs/subjectUid/$subjectUid - EHR by patient
    e06: /ehrs/ehrUid/$ehrUid - EHR by uid
    e07: /patients - patient collection
    e08: /patients/$uid - patient by uid
    e09: /queries/$queryUid - query by uid
    e10: /queries/$queryUid/execute - query execution
    e11: /queries - query collection
    e12: /contributions - contribution collection
  convention: The suffix .0066 is reused across groups for "requested output format is not supported".
