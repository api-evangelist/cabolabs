note: >-
  CaboLabs publishes NO package to any public language registry. Searches of npm
  ("cabolabs", "ehrserver"), Maven Central ("cabolabs", g:com.cabolabs), Packagist
  ("cabolabs") and PyPI all returned zero first-party results, and the openEHR-SDK
  README documents Gradle source builds only ("gradle clean build") with no
  publish/coordinates section. Every package below is therefore distributed as
  source or as a GitHub release artifact, so `registry: github` and the `version` /
  `published` fields are read from the GitHub release metadata rather than a
  registry metadata endpoint. This is the abandonment-signal caveat in reverse: the
  two flagship libraries are the MOST current things CaboLabs ships (openEHR-SDK
  2.5.2 released 2026-08-20, thirteen days before this probe), but a JVM consumer
  cannot `implementation 'com.cabolabs:openehr-sdk:2.5.2'` — they must build it.
