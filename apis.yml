aid: cabolabs
name: CaboLabs
description: 'CaboLabs Health Informatics is a Montevideo, Uruguay based health informatics
  company founded in 2012 by Pablo Pazos Gutierrez, specializing in clinical data standards
  and interoperability. It builds and licenses Atomik, a standardized openEHR Clinical Data
  Repository and Demographic Data Repository that implements the openEHR ITS REST API
  Release 1.0.2 over a JWT-authenticated JSON API, and maintains a family of Apache-2.0
  open source openEHR tooling including the EHRServer clinical data repository, the
  openEHR-SDK for JVM languages, the openEHR-CLI, an openEHR conformance verification
  framework, and the openEHR Toolkit. Alongside the software it delivers consultancy,
  audit and training services covering openEHR, HL7 FHIR, HL7 v2.x, CDA, DICOM and
  SNOMED CT for hospitals, health-tech startups and software vendors worldwide.'
