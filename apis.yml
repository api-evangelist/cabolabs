- aid: cabolabs-ehrserver-rest-api
  name: CaboLabs EHRServer REST API
  description: 'EHRServer is CaboLabs'' Apache-2.0 open source, service-oriented openEHR
    clinical data repository. It exposes a REST API under /rest/v1 for authentication,
    organizations, users, EHRs, operational templates, contributions, compositions and
    saved queries, plus a legacy /api/v1 surface and management and synchronization
    endpoints. The project publishes a machine-readable Insomnia request collection of
    73 requests and a wiki-published error-code registry. EHRServer is self-hosted, so
    the base URL is the deployer''s own host.'
  humanURL: https://cabolabs.com/our_software/ehrserver
  baseURL: https://{your-ehrserver-host}/rest/v1
