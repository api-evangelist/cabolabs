apis:
- aid: cabolabs-atomik-openehr-rest-api
  name: Atomik openEHR REST API
  description: 'Atomik is CaboLabs'' standardized Clinical Data Repository and Demographic
    Data Repository. Its REST API implements the official openEHR ITS REST specification
    Release 1.0.2 for EHR, EHR_STATUS, CONTRIBUTION, COMPOSITION and DIRECTORY, and adds
    CaboLabs-proposed API families for the openEHR demographic model (PERSON, ORGANISATION,
    GROUP, AGENT, ROLE, PARTY_RELATIONSHIP), administrative operations (conformance test
    support and physical deletion for right-to-be-forgotten), cluster synchronization,
    and monitoring/health indicators. The API is JSON-only as of June 2025, authenticated
    with a JWT bearer token obtained from POST /api/v1/auth, and is delivered as a
    per-customer instance on a licensed deployment.'
  humanURL: https://atomik.app/documentation/apis
  baseURL: https://{instance}.atomik.app/api/v1
